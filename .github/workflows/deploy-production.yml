name: Deploy JAGGAD Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaggad-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build, and Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # ============================================================
      # 2. PHP
      # ============================================================

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, gd, intl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      # ============================================================
      # 3. NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # ============================================================
      # 4. COMPOSER HANYA UNTUK TEST DI GITHUB RUNNER
      #
      # vendor TIDAK akan di-upload ke cPanel.
      # ============================================================

      - name: Install PHP dependencies for CI
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      # ============================================================
      # 5. TEST ENVIRONMENT
      # ============================================================

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # ============================================================
      # 6. FRONTEND
      # ============================================================

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Vite build
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "::error::public/build/manifest.json tidak ditemukan"
            exit 1
          fi

          echo "Vite build OK"

      # ============================================================
      # 7. TEST LARAVEL
      # ============================================================

      - name: Run Laravel tests
        run: php artisan test

      # ============================================================
      # 8. VERIFY STORAGE CONFIG
      # ============================================================

      - name: Verify production storage configuration
        run: |
          if ! grep -q "PUBLIC_STORAGE_PATH" config/filesystems.php; then
            echo "::error::config/filesystems.php belum menggunakan PUBLIC_STORAGE_PATH"
            exit 1
          fi

          echo "Production storage configuration OK"

      # ============================================================
      # 9. BUANG ENVIRONMENT TEST
      # ============================================================

      - name: Remove CI environment files
        run: |
          rm -f .env
          rm -f public/hot

      # ============================================================
      # 10. BUAT PAYLOAD PRODUCTION DENGAN WHITELIST
      #
      # TIDAK copy seluruh repository.
      #
      # Yang dikirim hanya:
      #
      # app/
      # bootstrap/app.php
      # bootstrap/providers.php
      # config/
      # database/migrations/
      # resources/views/
      # routes/
      # public/
      # artisan
      #
      # TIDAK ADA:
      #
      # .agents
      # .codex
      # .impeccable
      # AGENTS.md
      # DESIGN.md
      # PRODUCT.md
      # README.md
      # tests
      # vendor
      # node_modules
      # package files
      # docs
      # dev scripts
      # .env
      # ============================================================

      - name: Prepare production payload
        run: |
          rm -rf .deploy

          mkdir -p .deploy/app
          mkdir -p .deploy/public

          echo "Copying Laravel production runtime..."

          # Laravel application code
          cp -a app .deploy/app/app

          # Laravel bootstrap runtime files only
          mkdir -p .deploy/app/bootstrap
          cp bootstrap/app.php .deploy/app/bootstrap/app.php

          if [ -f bootstrap/providers.php ]; then
            cp bootstrap/providers.php .deploy/app/bootstrap/providers.php
          fi

          # Configuration
          cp -a config .deploy/app/config

          # Production database migrations only
          mkdir -p .deploy/app/database
          cp -a database/migrations .deploy/app/database/migrations

          # Blade templates only.
          # JSX/CSS source sudah dibuild oleh Vite sehingga tidak perlu
          # dikirim ke production.
          mkdir -p .deploy/app/resources
          cp -a resources/views .deploy/app/resources/views

          # Laravel routes
          cp -a routes .deploy/app/routes

          # Artisan diperlukan untuk Cron/migration manual
          cp artisan .deploy/app/artisan

          # Public runtime + hasil build Vite.
          # public/storage tidak boleh ikut.
          mkdir -p .deploy/app/public

          rsync -a public/ .deploy/app/public/ \
            --exclude='storage' \
            --exclude='hot'

          # public_html mendapatkan file public Laravel yang sama.
          rsync -a public/ .deploy/public/ \
            --exclude='storage' \
            --exclude='hot'

      # ============================================================
      # 11. INDEX.PHP KHUSUS PUBLIC_HTML
      # ============================================================

      - name: Create production public index.php
        run: |
          cat > .deploy/public/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $basePath = dirname(__DIR__).'/jaggad-academy';

          if (file_exists($maintenance = $basePath.'/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require $basePath.'/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once $basePath.'/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

      # ============================================================
      # 12. VALIDASI PAYLOAD
      # ============================================================

      - name: Verify production payload
        run: |
          echo "Top-level Laravel production payload:"
          find .deploy/app \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' \
            | sort

          echo ""
          echo "Validating required Laravel files..."

          test -d .deploy/app/app
          test -f .deploy/app/artisan
          test -f .deploy/app/bootstrap/app.php
          test -d .deploy/app/config
          test -d .deploy/app/database/migrations
          test -d .deploy/app/resources/views
          test -d .deploy/app/routes
          test -f .deploy/app/public/build/manifest.json

          echo ""
          echo "Validating public_html payload..."

          test -f .deploy/public/index.php
          test -f .deploy/public/.htaccess
          test -f .deploy/public/build/manifest.json

          echo ""
          echo "Checking forbidden development files..."

          test ! -e .deploy/app/.agents
          test ! -e .deploy/app/.codex
          test ! -e .deploy/app/.impeccable
          test ! -e .deploy/app/AGENTS.md
          test ! -e .deploy/app/DESIGN.md
          test ! -e .deploy/app/PRODUCT.md
          test ! -e .deploy/app/README.md
          test ! -e .deploy/app/tests
          test ! -e .deploy/app/vendor
          test ! -e .deploy/app/node_modules
          test ! -e .deploy/app/package.json
          test ! -e .deploy/app/package-lock.json
          test ! -e .deploy/app/.env

          echo ""
          echo "Production payload validation passed."

          echo ""
          echo "Number of Laravel payload files:"
          find .deploy/app -type f | wc -l

          echo "Number of public_html payload files:"
          find .deploy/public -type f | wc -l

      # ============================================================
      # 13. DEPLOY LARAVEL RUNTIME
      #
      # FTP root:
      # /home/jaggadac
      #
      # Server target:
      # /home/jaggadac/jaggad-academy
      #
      # Folder server-side berikut dipertahankan:
      #
      # vendor/
      # storage/
      # .env
      # .git/
      # bootstrap/cache/
      # ============================================================

      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}

          protocol: ftps
          security: loose
          port: 21

          local-dir: ./.deploy/app/
          server-dir: ./jaggad-academy/

          # State baru agar tidak memakai state deployment lama
          # yang sempat berisi vendor/dev files.
          state-name: .jaggad-production-v2-state.json

          log-level: minimal
          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
            .env
            vendor/**
            storage/**
            bootstrap/cache/**
            node_modules/**
            .agents/**
            .codex/**
            .impeccable/**
            tests/**

      # ============================================================
      # 14. DEPLOY PUBLIC_HTML
      #
      # /home/jaggadac/public_html/storage
      # tidak boleh disentuh karena itu upload CMS.
      # ============================================================

      - name: Deploy public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}

          protocol: ftps
          security: loose
          port: 21

          local-dir: ./.deploy/public/
          server-dir: ./public_html/

          # State baru juga untuk public deployment.
          state-name: .jaggad-public-v2-state.json

          log-level: minimal
          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
            storage/**
            .well-known/**
            cgi-bin/**

      # ============================================================
      # 15. VERIFY BIZNET
      #
      # Domain publik belum cutover, jadi resolve langsung
      # ke IP Biznet.
      # ============================================================

      - name: Verify production server
        run: |
          echo "Checking homepage..."

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve jaggadacademy.com:443:103.125.180.21 \
            https://jaggadacademy.com/ \
            > /dev/null

          echo "Checking Vite manifest..."

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve jaggadacademy.com:443:103.125.180.21 \
            https://jaggadacademy.com/build/manifest.json \
            > /dev/null

          echo "Production verification passed."

      # ============================================================
      # 16. DONE
      # ============================================================

      - name: Deployment completed
        run: |
          echo "============================================="
          echo "JAGGAD production deployment completed."
          echo "Only production runtime files were deployed."
          echo "============================================="
