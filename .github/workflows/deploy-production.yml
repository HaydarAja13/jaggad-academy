name: Deploy JAGGAD Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaggad-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build, and Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # ============================================================
      # 2. SETUP PHP
      # ============================================================

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, gd, intl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      # ============================================================
      # 3. SETUP NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # ============================================================
      # 4. INSTALL PHP DEPENDENCIES UNTUK CI SAJA
      #
      # vendor diperlukan di GitHub runner untuk test.
      # vendor TIDAK dikirim via FTP ke hosting.
      # ============================================================

      - name: Install PHP dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      # ============================================================
      # 5. TEST ENV
      # ============================================================

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # ============================================================
      # 6. FRONTEND
      # ============================================================

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Vite build
        run: |
          test -f public/build/manifest.json
          echo "Vite build OK"

      # ============================================================
      # 7. TEST
      # ============================================================

      - name: Run Laravel tests
        run: php artisan test

      # ============================================================
      # 8. VERIFY STORAGE CONFIG
      # ============================================================

      - name: Verify production storage configuration
        run: |
          if ! grep -q "PUBLIC_STORAGE_PATH" config/filesystems.php; then
            echo "::error::config/filesystems.php belum menggunakan PUBLIC_STORAGE_PATH"
            exit 1
          fi

          echo "Production storage configuration OK"

      # ============================================================
      # 9. REMOVE RUNNER-SPECIFIC FILES
      # ============================================================

      - name: Remove runner-specific files
        run: |
          rm -f .env
          rm -f bootstrap/cache/config.php
          rm -f bootstrap/cache/events.php
          rm -f bootstrap/cache/routes-*.php
          rm -f bootstrap/cache/packages.php
          rm -f bootstrap/cache/services.php
          rm -f public/hot

      # ============================================================
      # 10. PREPARE LARAVEL PAYLOAD
      #
      # PENTING:
      # - vendor tidak dikirim
      # - node_modules tidak dikirim
      # - .env hosting tidak disentuh
      # - user uploads tidak disentuh
      # ============================================================

      - name: Prepare Laravel application payload
        run: |
          rm -rf .deploy
          mkdir -p .deploy/app
          mkdir -p .deploy/public

          rsync -a ./ .deploy/app/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy/' \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/app/public/' \
            --exclude='storage/app/private/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/pail/' \
            --exclude='public/storage' \
            --exclude='public/hot'

          rsync -a public/ .deploy/public/ \
            --exclude='storage' \
            --exclude='hot'

      # ============================================================
      # 11. GENERATE PUBLIC_HTML INDEX.PHP
      # ============================================================

      - name: Create production public index.php
        run: |
          cat > .deploy/public/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $basePath = dirname(__DIR__).'/jaggad-academy';

          if (file_exists($maintenance = $basePath.'/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require $basePath.'/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once $basePath.'/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

      # ============================================================
      # 12. VERIFY PAYLOAD
      # ============================================================

      - name: Verify deployment payloads
        run: |
          test -f .deploy/app/artisan
          test -f .deploy/app/bootstrap/app.php
          test -f .deploy/app/public/build/manifest.json

          test -f .deploy/public/index.php
          test -f .deploy/public/.htaccess
          test -f .deploy/public/build/manifest.json

          if [ -d .deploy/app/vendor ]; then
            echo "::error::vendor tidak boleh masuk payload FTP"
            exit 1
          fi

          if [ -f .deploy/app/.env ]; then
            echo "::error::.env tidak boleh masuk payload FTP"
            exit 1
          fi

          echo "Deployment payloads OK"

      # ============================================================
      # 13. DEPLOY LARAVEL SOURCE
      #
      # vendor hosting dipertahankan.
      # ============================================================

      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}

          protocol: ftps
          security: loose
          port: 21

          local-dir: ./.deploy/app/
          server-dir: ./jaggad-academy/

          state-name: .jaggad-app-deploy-state.json
          log-level: minimal
          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
            vendor/**
            node_modules/**
            .env
            storage/app/public/**
            storage/app/private/**
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/pail/**
            public/storage

      # ============================================================
      # 14. DEPLOY PUBLIC_HTML
      #
      # storage/ tetap aman.
      # ============================================================

      - name: Deploy public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}

          protocol: ftps
          security: loose
          port: 21

          local-dir: ./.deploy/public/
          server-dir: ./public_html/

          state-name: .jaggad-public-deploy-state.json
          log-level: minimal
          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
            storage/**
            .well-known/**
            cgi-bin/**

      # ============================================================
      # 15. VERIFY BIZNET SERVER
      #
      # DNS publik belum cutover.
      # ============================================================

      - name: Verify production server
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve jaggadacademy.com:443:103.125.180.21 \
            https://jaggadacademy.com/ \
            > /dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve jaggadacademy.com:443:103.125.180.21 \
            https://jaggadacademy.com/build/manifest.json \
            > /dev/null

          echo "Production verification passed."

      # ============================================================
      # 16. DONE
      # ============================================================

      - name: Deployment completed
        run: |
          echo "JAGGAD production deployment completed."
