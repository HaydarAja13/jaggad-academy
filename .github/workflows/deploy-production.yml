name: Deploy JAGGAD Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaggad-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build, and Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # ============================================================
      # 2. PHP
      # ============================================================

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, gd, intl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      # ============================================================
      # 3. NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # ============================================================
      # 4. PHP DEPENDENCIES UNTUK TEST
      # ============================================================

      - name: Install PHP development dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      # ============================================================
      # 5. TEST ENVIRONMENT
      # ============================================================

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # ============================================================
      # 6. FRONTEND DEPENDENCIES
      # ============================================================

      - name: Install frontend dependencies
        run: npm ci

      # ============================================================
      # 7. BUILD VITE
      # ============================================================

      - name: Build frontend
        run: npm run build

      # ============================================================
      # 8. VERIFY BUILD
      # ============================================================

      - name: Verify Vite build
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "::error::public/build/manifest.json tidak ditemukan"
            exit 1
          fi

          echo "Vite manifest ditemukan:"
          ls -lah public/build/manifest.json

      # ============================================================
      # 9. LARAVEL TESTS
      # ============================================================

      - name: Run Laravel tests
        run: php artisan test

      # ============================================================
      # 10. PRODUCTION VENDOR
      # ============================================================

      - name: Build production Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      # ============================================================
      # 11. VERIFY STORAGE CONFIG
      # ============================================================

      - name: Verify production storage configuration
        run: |
          if ! grep -q "PUBLIC_STORAGE_PATH" config/filesystems.php; then
            echo "::error::config/filesystems.php belum menggunakan PUBLIC_STORAGE_PATH"
            exit 1
          fi

          echo "PUBLIC_STORAGE_PATH configuration ditemukan."

      # ============================================================
      # 12. HAPUS CACHE DARI GITHUB RUNNER
      # ============================================================

      - name: Remove runner Laravel caches
        run: |
          rm -f bootstrap/cache/config.php
          rm -f bootstrap/cache/events.php
          rm -f bootstrap/cache/routes-*.php
          rm -f bootstrap/cache/packages.php
          rm -f bootstrap/cache/services.php

      # ============================================================
      # 13. PREPARE DEPLOYMENT PAYLOADS
      # ============================================================

      - name: Prepare deployment folders
        run: |
          rm -rf .deploy

          mkdir -p .deploy/app
          mkdir -p .deploy/public

          echo "Preparing Laravel application payload..."

          rsync -a ./ .deploy/app/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/app/public/' \
            --exclude='storage/app/private/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/pail/' \
            --exclude='public/storage' \
            --exclude='public/hot'

          echo "Preparing public_html payload..."

          rsync -a public/ .deploy/public/ \
            --exclude='storage' \
            --exclude='hot'

      # ============================================================
      # 14. INDEX.PHP KHUSUS CPANEL
      # ============================================================

      - name: Create production public index.php
        run: |
          cat > .deploy/public/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $basePath = dirname(__DIR__).'/jaggad-academy';

          if (file_exists($maintenance = $basePath.'/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require $basePath.'/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once $basePath.'/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

      # ============================================================
      # 15. VERIFY PAYLOAD
      # ============================================================

      - name: Verify deployment payloads
        run: |
          echo "Checking Laravel payload..."

          test -f .deploy/app/artisan
          test -f .deploy/app/vendor/autoload.php
          test -f .deploy/app/bootstrap/app.php

          echo "Checking public_html payload..."

          test -f .deploy/public/index.php
          test -f .deploy/public/.htaccess
          test -f .deploy/public/build/manifest.json

          echo "Deployment payload validation passed."

      # ============================================================
      # 16. DEPLOY LARAVEL APP
      #
      # FTP root:
      # /home/jaggadac
      #
      # Target:
      # /home/jaggadac/jaggad-academy
      # ============================================================

      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}

          protocol: ftps
          security: loose
          port: 21

          local-dir: ./.deploy/app/
          server-dir: ./jaggad-academy/

          state-name: .jaggad-app-deploy-state.json
          log-level: standard
          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            storage/app/public/**
            storage/app/private/**
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/pail/**
            public/storage

      # ============================================================
      # 17. DEPLOY PUBLIC_HTML
      #
      # Target:
      # /home/jaggadac/public_html
      #
      # storage/ TIDAK BOLEH disentuh.
      # ============================================================

      - name: Deploy public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}

          protocol: ftps
          security: loose
          port: 21

          local-dir: ./.deploy/public/
          server-dir: ./public_html/

          state-name: .jaggad-public-deploy-state.json
          log-level: standard
          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            storage/**
            .well-known/**
            cgi-bin/**

      # ============================================================
      # 18. VERIFY SERVER BARU
      #
      # DNS publik belum pindah, jadi pakai --resolve langsung
      # ke IP Biznet.
      # ============================================================

      - name: Verify production server
        run: |
          echo "Checking homepage on Biznet..."

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve jaggadacademy.com:443:103.125.180.21 \
            https://jaggadacademy.com/ \
            > /dev/null

          echo "Checking Vite manifest on Biznet..."

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve jaggadacademy.com:443:103.125.180.21 \
            https://jaggadacademy.com/build/manifest.json \
            > /dev/null

          echo "Production server verification passed."

      # ============================================================
      # 19. COMPLETE
      # ============================================================

      - name: Deployment completed
        run: |
          echo "============================================="
          echo "JAGGAD production deployment completed."
          echo "============================================="
