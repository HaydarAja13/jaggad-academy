name: Deploy JAGGAD Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaggad-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test Build and Dry Run Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, gd, intl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build production vendor
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Verify production storage configuration
        run: |
          if ! grep -q "PUBLIC_STORAGE_PATH" config/filesystems.php; then
            echo "::error::config/filesystems.php belum menggunakan PUBLIC_STORAGE_PATH"
            exit 1
          fi

      - name: Remove local environment caches
        run: |
          rm -f bootstrap/cache/config.php
          rm -f bootstrap/cache/events.php
          rm -f bootstrap/cache/routes-*.php

      - name: Prepare deployment folders
        run: |
          rm -rf .deploy
          mkdir -p .deploy/app
          mkdir -p .deploy/public

          rsync -a ./ .deploy/app/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/app/public/' \
            --exclude='storage/app/private/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='public/storage'

          rsync -a public/ .deploy/public/ \
            --exclude='storage' \
            --exclude='hot'

      - name: Create production public index.php
        run: |
          cat > .deploy/public/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $basePath = dirname(__DIR__).'/jaggad-academy';

          if (file_exists($maintenance = $basePath.'/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require $basePath.'/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once $basePath.'/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

      - name: Dry run Laravel deployment
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          port: 21
          local-dir: ./.deploy/app/
          server-dir: ./jaggad-academy/
          state-name: .jaggad-app-deploy-state.json
          dry-run: true
          log-level: standard
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            storage/app/public/**
            storage/app/private/**
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**

      - name: Dry run public_html deployment
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          port: 21
          local-dir: ./.deploy/public/
          server-dir: ./public_html/
          state-name: .jaggad-public-deploy-state.json
          dry-run: true
          log-level: standard
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            storage/**
            .well-known/**
            cgi-bin/**
