name: Deploy JAGGAD Production
on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaggad-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build, and Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # ============================================================
      # 2. PHP
      # ============================================================

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, gd, intl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      # ============================================================
      # 3. NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # ============================================================
      # 4. INSTALL LFTP
      # ============================================================

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

          echo "lftp version:"
          lftp --version | head -n 1

      # ============================================================
      # 5. COMPOSER UNTUK CI
      #
      # vendor hanya dipakai di GitHub runner untuk test.
      # vendor TIDAK di-upload ke hosting.
      # ============================================================

      - name: Install PHP dependencies for CI
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      # ============================================================
      # 6. TEST ENV
      # ============================================================

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # ============================================================
      # 7. FRONTEND BUILD
      # ============================================================

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Vite build
        run: |
          test -f public/build/manifest.json
          echo "Vite build OK"

      # ============================================================
      # 8. TEST LARAVEL
      # ============================================================

      - name: Run Laravel tests
        run: php artisan test

      # ============================================================
      # 9. VERIFY STORAGE CONFIG
      # ============================================================

      - name: Verify production storage configuration
        run: |
          if ! grep -q "PUBLIC_STORAGE_PATH" config/filesystems.php; then
            echo "::error::config/filesystems.php belum menggunakan PUBLIC_STORAGE_PATH"
            exit 1
          fi

          echo "Production storage configuration OK"

      # ============================================================
      # 10. REMOVE CI ENV
      # ============================================================

      - name: Remove CI environment files
        run: |
          rm -f .env
          rm -f public/hot

      # ============================================================
      # 11. BUILD PRODUCTION-ONLY PAYLOAD
      #
      # WHITELIST.
      # Tidak copy seluruh repository.
      # ============================================================

      - name: Prepare production payload
        run: |
          rm -rf .deploy

          mkdir -p .deploy/app
          mkdir -p .deploy/public

          # --------------------------------------------------------
          # Laravel runtime
          # --------------------------------------------------------

          cp -a app .deploy/app/app

          mkdir -p .deploy/app/bootstrap

          cp bootstrap/app.php \
            .deploy/app/bootstrap/app.php

          if [ -f bootstrap/providers.php ]; then
            cp bootstrap/providers.php \
              .deploy/app/bootstrap/providers.php
          fi

          cp -a config .deploy/app/config

          mkdir -p .deploy/app/database
          cp -a database/migrations \
            .deploy/app/database/migrations

          mkdir -p .deploy/app/resources
          cp -a resources/views \
            .deploy/app/resources/views

          cp -a routes .deploy/app/routes

          cp artisan .deploy/app/artisan

          # --------------------------------------------------------
          # Laravel public/
          # --------------------------------------------------------

          mkdir -p .deploy/app/public

          rsync -a public/ .deploy/app/public/ \
            --exclude='storage' \
            --exclude='hot'

          # --------------------------------------------------------
          # public_html/
          # --------------------------------------------------------

          rsync -a public/ .deploy/public/ \
            --exclude='storage' \
            --exclude='hot'

      # ============================================================
      # 12. GENERATE PUBLIC_HTML INDEX.PHP
      # ============================================================

      - name: Create production public index.php
        run: |
          cat > .deploy/public/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $basePath = dirname(__DIR__).'/jaggad-academy';

          if (file_exists($maintenance = $basePath.'/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require $basePath.'/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once $basePath.'/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

          MIGRATION_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$MIGRATION_TOKEN"
          echo "MIGRATION_TOKEN=$MIGRATION_TOKEN" >> "$GITHUB_ENV"

          cat > .deploy/public/jaggad-deploy-migrate.php <<PHP
          <?php

          declare(strict_types=1);

          if (! hash_equals('$MIGRATION_TOKEN', (string) (\$_GET['token'] ?? ''))) {
              http_response_code(404);
              exit;
          }

          \$basePath = dirname(__DIR__).'/jaggad-academy';
          require \$basePath.'/vendor/autoload.php';
          \$app = require \$basePath.'/bootstrap/app.php';
          \$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          try {
              \$exitCode = Illuminate\Support\Facades\Artisan::call('migrate', ['--force' => true]);
              if (\$exitCode !== 0) {
                  http_response_code(500);
                  echo 'migration-failed';
              } else {
                  echo 'migrations-ok';
              }
          } finally {
              @unlink(__FILE__);
          }
          PHP

      # ============================================================
      # 13. VERIFY PAYLOAD
      # ============================================================

      - name: Verify production payload
        run: |
          echo "Laravel payload:"
          find .deploy/app \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' \
            | sort

          echo ""
          echo "Checking required files..."

          test -d .deploy/app/app
          test -f .deploy/app/artisan
          test -f .deploy/app/bootstrap/app.php
          test -d .deploy/app/config
          test -d .deploy/app/database/migrations
          test -d .deploy/app/resources/views
          test -d .deploy/app/routes
          test -f .deploy/app/public/build/manifest.json

          test -f .deploy/public/index.php
          test -f .deploy/public/.htaccess
          test -f .deploy/public/build/manifest.json
          test -f .deploy/public/jaggad-deploy-migrate.php

          echo ""
          echo "Checking forbidden files..."

          test ! -e .deploy/app/.agents
          test ! -e .deploy/app/.codex
          test ! -e .deploy/app/.impeccable
          test ! -e .deploy/app/vendor
          test ! -e .deploy/app/node_modules
          test ! -e .deploy/app/tests
          test ! -e .deploy/app/.env
          test ! -e .deploy/app/AGENTS.md
          test ! -e .deploy/app/DESIGN.md
          test ! -e .deploy/app/PRODUCT.md

          echo ""
          echo "Laravel payload files:"
          find .deploy/app -type f | wc -l

          echo "public_html payload files:"
          find .deploy/public -type f | wc -l

          echo "Payload verification passed."

      # ============================================================
      # 14. TEST FTP LOGIN + DIRECTORY
      #
      # Login/control menggunakan TLS.
      #
      # Untuk sementara certificate verification dimatikan karena
      # kita masih connect menggunakan IP Biznet.
      # ============================================================

      - name: Test cPanel FTP connection
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set net:timeout 20;
            set net:max-retries 2;

            set ftp:passive-mode yes;
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data no;

            set ssl:verify-certificate no;

            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST:21;

            cd jaggad-academy;
            pwd;

            cd ../public_html;
            pwd;

            bye;
          "

          echo "FTP login and target directories OK."

      # ============================================================
      # 15. DEPLOY LARAVEL
      #
      # Pertama coba:
      #
      # FTPS control  = encrypted
      # FTPS data     = encrypted
      #
      # Kalau data TLS Biznet gagal, fallback otomatis:
      #
      # control/login = encrypted
      # data transfer = clear
      #
      # Username/password tetap dikirim melalui TLS.
      # ============================================================

      - name: Deploy Laravel application
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          echo "Attempting full FTPS deployment..."

          if lftp -c "
            set cmd:fail-exit yes;
            set net:timeout 30;
            set net:max-retries 2;

            set ftp:passive-mode yes;

            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;

            set ssl:verify-certificate no;

            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST:21;

            mirror \
              --reverse \
              --only-newer \
              --verbose \
              --parallel=2 \
              .deploy/app/ \
              jaggad-academy/;

            bye;
          "; then
            echo "Full FTPS Laravel deployment succeeded."
          else
            echo ""
            echo "Full TLS data channel rejected by hosting."
            echo "Retrying with encrypted login/control channel..."
            echo ""

            lftp -c "
              set cmd:fail-exit yes;
              set net:timeout 30;
              set net:max-retries 2;

              set ftp:passive-mode yes;

              set ftp:ssl-allow yes;
              set ftp:ssl-force yes;
              set ftp:ssl-protect-data no;

              set ssl:verify-certificate no;

              open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST:21;

              mirror \
                --reverse \
                --only-newer \
                --verbose \
                --parallel=2 \
                .deploy/app/ \
                jaggad-academy/;

              bye;
            "
          fi

      # ============================================================
      # 16. DEPLOY PUBLIC_HTML
      #
      # public_html/storage TIDAK ada dalam local payload,
      # dan kita TIDAK menggunakan --delete.
      # ============================================================

      - name: Deploy public_html
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          echo "Attempting full FTPS deployment..."

          if lftp -c "
            set cmd:fail-exit yes;
            set net:timeout 30;
            set net:max-retries 2;

            set ftp:passive-mode yes;

            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;

            set ssl:verify-certificate no;

            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST:21;

            mirror \
              --reverse \
              --only-newer \
              --verbose \
              --parallel=2 \
              .deploy/public/ \
              public_html/;

            bye;
          "; then
            echo "Full FTPS public_html deployment succeeded."
          else
            echo ""
            echo "Full TLS data channel rejected by hosting."
            echo "Retrying with encrypted login/control channel..."
            echo ""

            lftp -c "
              set cmd:fail-exit yes;
              set net:timeout 30;
              set net:max-retries 2;

              set ftp:passive-mode yes;

              set ftp:ssl-allow yes;
              set ftp:ssl-force yes;
              set ftp:ssl-protect-data no;

              set ssl:verify-certificate no;

              open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST:21;

              mirror \
                --reverse \
                --only-newer \
                --verbose \
                --parallel=2 \
                .deploy/public/ \
                public_html/;

              bye;
            "
          fi

      - name: Run production migrations
        run: |
          RESPONSE="$(curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve jaggadacademy.com:443:103.125.180.21 \
            "https://jaggadacademy.com/jaggad-deploy-migrate.php?token=$MIGRATION_TOKEN")"

          test "$RESPONSE" = "migrations-ok"
          echo "Production migrations completed."

      - name: Remove migration endpoint
        if: always()
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          lftp -c "
            set cmd:fail-exit no;
            set net:timeout 20;
            set net:max-retries 1;
            set ftp:passive-mode yes;
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data no;
            set ssl:verify-certificate no;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" ftp://$FTP_HOST:21;
            rm -f public_html/jaggad-deploy-migrate.php;
            bye;
          "

      # ============================================================
      # 17. VERIFY BIZNET PRODUCTION
      #
      # DNS publik belum cutover.
      # ============================================================

      - name: Verify production server
        run: |
          echo "Checking homepage..."

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve jaggadacademy.com:443:103.125.180.21 \
            https://jaggadacademy.com/ \
            > /dev/null

          echo "Checking Vite manifest..."

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve jaggadacademy.com:443:103.125.180.21 \
            https://jaggadacademy.com/build/manifest.json \
            > /dev/null

          echo "Production verification passed."

      # ============================================================
      # 18. DONE
      # ============================================================

      - name: Deployment completed
        run: |
          echo "============================================="
          echo "JAGGAD production deployment completed."
          echo "============================================="
